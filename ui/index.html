<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quota Widget</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="widget-frame" id="widgetFrame">
    <header class="widget-header pywebview-drag-region" id="widgetHeader">
      <div class="header-left">
        <span class="live-dot" id="globalLiveDot" title="Trạng thái kết nối"></span>
        <span class="header-title">Quota</span>
        <span class="header-time" id="lastUpdated">--:--</span>
      </div>

      <div class="header-actions no-drag">
        <button class="pill-btn no-drag" id="btnMetric" title="Đổi hiển thị % Còn lại / Đã dùng">
          Còn lại
        </button>

        <button class="icon-btn no-drag" id="btnCompact" title="Chuyển chế độ Thu gọn (Mini HUD)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </button>

        <button class="icon-btn pin-btn active no-drag" id="btnPin" title="Ghim luôn nổi trên màn hình">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
          </svg>
        </button>

        <button class="icon-btn no-drag" id="btnRefresh" title="Làm mới ngay">
          <svg class="spin-target" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>

        <button class="icon-btn no-drag" id="btnSettings" title="Cấu hình &amp; Độ mờ">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>

        <span class="header-sep"></span>

        <button class="icon-btn no-drag" id="btnMinimize" title="Thu nhỏ xuống Taskbar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="5" y1="14" x2="19" y2="14" />
          </svg>
        </button>

        <button class="icon-btn close-btn no-drag" id="btnClose" title="Đóng Widget">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
    </header>

    <main class="widget-body" id="fullView">
      <div class="card-list" id="cardList">
        <div class="loading-skeleton">Đang lấy dữ liệu quota...</div>
      </div>
    </main>

    <main class="compact-hud hidden" id="compactView">
      <div class="hud-grid" id="hudGrid"></div>
    </main>

    <section class="settings-drawer hidden" id="settingsDrawer" aria-hidden="true">
      <div class="drawer-header">
        <span class="drawer-title">Cài đặt Widget</span>
        <button class="icon-btn" id="btnCloseSettings" title="Đóng cài đặt">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>

      <div class="drawer-body">
        <div class="setting-row">
          <div class="setting-label-row">
            <span>Độ mờ cửa sổ</span>
            <span class="mono-val" id="opacityValLabel">96%</span>
          </div>
          <input type="range" id="inputOpacity" min="50" max="100" step="1" value="96" />
        </div>

        <div class="setting-row setting-inline">
          <span>Tự động làm mới</span>
          <select id="inputInterval" class="select-input">
            <option value="30">30 giây</option>
            <option value="60" selected>60 giây</option>
            <option value="120">2 phút</option>
            <option value="300">5 phút</option>
          </select>
        </div>

        <div class="setting-row setting-inline">
          <div>
            <div>Hiển thị Demo cho Claude</div>
            <div class="setting-hint">Hiện số mẫu nếu chưa gắn token Claude</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="inputDemo" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row setting-inline">
          <div>
            <div>Tự động đọc Claude</div>
            <div class="setting-hint">Lấy từ Claude Desktop / CLI / Keyring</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="inputClaudeAuto" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="drawer-divider"></div>

        <div class="setting-row">
          <div class="setting-label-row">
            <span>Claude OAuth Token</span>
            <span class="token-state" id="oauthTokenState">Chưa có</span>
          </div>
          <div class="input-with-clear">
            <input type="password" id="inputClaudeOauth" class="text-input" placeholder="Dán token mới (để trống nếu giữ nguyên)..." autocomplete="off" />
            <button class="clear-btn hidden" id="btnClearOauth" type="button" title="Xóa token đã lưu">Xóa</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-label-row">
            <span>Claude Web sessionKey</span>
            <span class="token-state" id="sessionKeyState">Chưa có</span>
          </div>
          <div class="input-with-clear">
            <input type="password" id="inputClaudeSession" class="text-input" placeholder="sk-ant-sid01-... (cookie claude.ai)" autocomplete="off" />
            <button class="clear-btn hidden" id="btnClearSession" type="button" title="Xóa cookie đã lưu">Xóa</button>
          </div>
        </div>

        <div class="setting-row">
          <button class="btn-ghost" id="btnClaudeLoginSettings" type="button">Đăng nhập / Đổi tài khoản Claude (Google / Email)</button>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="btn-ghost" id="btnCancelSettings" type="button">Đóng</button>
        <button class="btn-primary" id="btnSaveSettings" type="button">Lưu &amp; Áp dụng</button>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
